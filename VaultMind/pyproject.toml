[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultmind"
version = "0.1.0"
description = "Private, offline AI knowledge vault. Drag-and-drop ingestion, local LLM Q&A."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "KRLSA"}]

dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.32",
    "httpx>=0.27,<0.29",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "pymupdf>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "python-pptx>=1.0,<2.0",
    "ebooklib>=0.18,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "readability-lxml>=0.8,<1.0",
    "chardet>=5.2,<6.0",
    "pytesseract>=0.3,<1.0",
    "Pillow>=10.0,<12.0",
    "openvino>=2024.4,<2025.0",
    "openvino-genai>=2024.4,<2025.0",
    "openvino-tokenizers>=2024.4,<2025.0",
    "yt-dlp>=2024.08,<2026.0",
    "tiktoken>=0.7,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pyinstaller>=6.10,<7.0",
]

[tool.setuptools]
packages = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]
ignore = ["E501"]  # line length enforced separately

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]